<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>صندوق خانوادگی</title>
<meta name="theme-color" content="#0e5f52">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f2ea;--surface:#fff;--surface2:#faf8f3;--ink:#1b2a29;--muted:#6b7773;--line:#e6e1d5;
  --pri:#0e5f52;--pri-ink:#fff;--pri-soft:#dff0ea;--gold:#c28a2c;--gold-soft:#f6ead2;
  --ok:#1c7a4b;--ok-soft:#dcf1e5;--bad:#b4372b;--bad-soft:#f9e1de;--warn:#a96a0b;--warn-soft:#fbeed4;
  --shadow:0 1px 2px rgba(20,40,35,.06),0 6px 18px rgba(20,40,35,.06);--r:16px;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#0f1816;--surface:#16231f;--surface2:#1b2a26;--ink:#e8efec;--muted:#95a6a0;--line:#26372f;
  --pri:#2fa78f;--pri-ink:#04201a;--pri-soft:#173a32;--gold:#e0b052;--gold-soft:#3a3016;
  --ok:#52c98a;--ok-soft:#173a29;--bad:#ff8a7d;--bad-soft:#40201c;--warn:#f0b455;--warn-soft:#3b2d12;
  --shadow:0 1px 2px rgba(0,0,0,.4);}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Vazirmatn",Tahoma,"Noto Sans Arabic",system-ui,sans-serif;line-height:1.6;
  padding-bottom:calc(76px + env(safe-area-inset-bottom));min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
.boot{padding:40vh 0;text-align:center;color:var(--muted)}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
/* top bar */
.top{position:sticky;top:0;z-index:20;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 0 8px}
.top .wrap{display:flex;align-items:center;gap:10px}
.top h1{font-size:1.05rem;margin:0;flex:1;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;font-size:1.1rem}
.icon-btn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer}
.sync{font-size:.72rem;padding:3px 9px;border-radius:99px;background:var(--surface);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.sync i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-inline-end:5px}
.sync.off i{background:var(--warn)}.sync.pend i{background:var(--gold)}.sync.demo i{background:var(--pri)}
/* cards */
main.wrap{padding-top:6px;padding-bottom:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow);margin-bottom:12px}
.card h2{font-size:.95rem;margin:0 0 10px;font-weight:800;display:flex;align-items:center;justify-content:space-between;gap:8px}
.card h2 small{font-weight:400;color:var(--muted);font-size:.78rem}
.hero{background:linear-gradient(145deg,#0e5f52 0%,#0a4a40 60%,#083a33 100%);color:#fff;border:0;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset-inline-start:-40px;top:-40px;width:160px;height:160px;border-radius:50%;border:26px solid rgba(255,255,255,.06)}
.hero .lbl{font-size:.82rem;opacity:.8}
.hero .big{font-size:2.1rem;font-weight:800;letter-spacing:-.5px;line-height:1.25}
.hero .big small{font-size:.9rem;font-weight:500;opacity:.8;margin-inline-start:6px}
.hero .sub{display:flex;gap:18px;margin-top:10px;font-size:.82rem;flex-wrap:wrap}
.hero .sub b{display:block;font-size:1rem;color:#f3d894}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
.kpi .l{font-size:.76rem;color:var(--muted)}
.kpi .v{font-size:1.15rem;font-weight:800;margin-top:2px}
.kpi .v small{font-size:.7rem;font-weight:400;color:var(--muted)}
.kpi.bad .v{color:var(--bad)}.kpi.ok .v{color:var(--ok)}.kpi.gold .v{color:var(--gold)}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}.small{font-size:.8rem}
/* chips */
.chip{display:inline-block;font-size:.72rem;padding:2px 10px;border-radius:99px;font-weight:500;white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}.chip.mut{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.fchip{border:1px solid var(--line);background:var(--surface);padding:5px 14px;border-radius:99px;font-size:.82rem;cursor:pointer}
.fchip.on{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
/* lists */
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:0}
.av{width:40px;height:40px;border-radius:50%;background:var(--pri-soft);color:var(--pri);display:grid;place-items:center;font-weight:800;flex:none}
.av.bad{background:var(--bad-soft);color:var(--bad)}.av.gold{background:var(--gold-soft);color:var(--gold)}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:.78rem;color:var(--muted)}
.row .amt{font-weight:700;text-align:end;white-space:nowrap}
.row .amt.pos{color:var(--ok)}.row .amt.neg{color:var(--bad)}
.empty{text-align:center;color:var(--muted);padding:26px 8px}
/* progress */
.bar{height:9px;border-radius:99px;background:var(--surface2);border:1px solid var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--pri);border-radius:99px}
.bar.gold>i{background:var(--gold)}
/* form controls */
.search{width:100%;padding:11px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);margin-bottom:10px}
label.f{display:block;margin-bottom:12px;font-size:.82rem;color:var(--muted)}
label.f>span{display:block;margin-bottom:4px}
.in,select.in,input.in{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:1rem}
.in:focus,.search:focus{outline:2px solid var(--pri);outline-offset:1px}
.in.ltr{direction:ltr;text-align:right}
.r3{display:grid;grid-template-columns:1.2fr 1.4fr 1fr;gap:8px}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{border:0;border-radius:12px;padding:11px 18px;background:var(--pri);color:var(--pri-ink);font-weight:700;cursor:pointer;font-size:.95rem}
.btn.sec{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.bad{background:var(--bad);color:#fff}
.btn.sm{padding:6px 12px;font-size:.8rem;border-radius:10px}
.btn.block{display:block;width:100%}
.btn:disabled{opacity:.5}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.seg button{flex:1 1 auto;border:1px solid var(--line);background:var(--surface);padding:8px 10px;border-radius:12px;font-size:.82rem;cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--pri);color:var(--pri-ink);border-color:var(--pri);font-weight:700}
.note{padding:10px 12px;border-radius:12px;font-size:.82rem;margin-bottom:12px;background:var(--surface2);border:1px solid var(--line)}
.note.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.note.bad{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.note.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
/* tiles in member page */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.tile{background:var(--surface2);border-radius:12px;padding:9px 10px;text-align:center;border:1px solid var(--line)}
.tile b{display:block;font-size:.95rem}.tile span{font-size:.7rem;color:var(--muted)}
.strip{display:grid;grid-template-columns:repeat(12,1fr);gap:4px}
.strip div{aspect-ratio:1;border-radius:8px;display:grid;place-items:center;font-size:.62rem;background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.strip .paid,.cell.paid{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.strip .unpaid,.cell.unpaid{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.strip .due,.cell.due{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.strip .partial,.cell.partial{background:var(--gold-soft);color:var(--gold);border-color:transparent}
.strip .overdue{background:var(--bad-soft);color:var(--bad);border-color:transparent}
/* matrix */
.scroll{overflow:auto;border-radius:12px;border:1px solid var(--line);max-height:70vh}
table.mx{border-collapse:separate;border-spacing:0;font-size:.74rem;width:100%;min-width:640px}
table.mx th,table.mx td{padding:6px 4px;text-align:center;border-bottom:1px solid var(--line);background:var(--surface)}
table.mx th{position:sticky;top:0;z-index:2;background:var(--surface2);font-weight:700}
table.mx td:first-child,table.mx th:first-child{position:sticky;inset-inline-start:0;z-index:3;text-align:start;padding-inline:8px;min-width:96px;max-width:110px;background:var(--surface2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
table.mx .cell{font-weight:700}
table.mx tfoot td{font-weight:800;background:var(--surface2)}
table.t{width:100%;border-collapse:collapse;font-size:.82rem}
table.t th{text-align:start;color:var(--muted);font-weight:500;padding:6px 4px;border-bottom:1px solid var(--line)}
table.t td{padding:7px 4px;border-bottom:1px solid var(--line)}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:.72rem;color:var(--muted);margin:8px 0}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:5px;vertical-align:-1px;background:var(--c)}
/* bottom nav + fab */
.nav{position:fixed;bottom:0;inset-inline:0;background:var(--surface);border-top:1px solid var(--line);z-index:30;padding-bottom:env(safe-area-inset-bottom)}
.nav .wrap{display:flex;padding:0}
.nav a{flex:1;text-align:center;padding:8px 2px 7px;font-size:.7rem;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
.nav a svg{width:22px;height:22px}
.nav a.on{color:var(--pri);font-weight:700}
.fab{position:fixed;inset-inline-start:18px;bottom:calc(86px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:18px;border:0;background:var(--gold);color:#fff;font-size:2rem;line-height:1;box-shadow:0 8px 22px rgba(0,0,0,.28);z-index:25;cursor:pointer}
/* sheet */
.backdrop{position:fixed;inset:0;background:rgba(10,20,18,.5);z-index:50;animation:fade .15s}
.sheet{position:fixed;bottom:0;inset-inline:0;max-width:760px;margin:0 auto;background:var(--bg);z-index:51;border-radius:22px 22px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;animation:up .2s}
.sheet h3{margin:0 0 12px;font-size:1.05rem}
.sheet .grab{width:42px;height:4px;border-radius:9px;background:var(--line);margin:-6px auto 12px}
@keyframes up{from{transform:translateY(30px);opacity:0}}@keyframes fade{from{opacity:0}}
#toast{position:fixed;bottom:calc(92px + env(safe-area-inset-bottom));inset-inline:16px;margin:0 auto;max-width:420px;background:#17302b;color:#fff;padding:11px 16px;border-radius:14px;z-index:90;text-align:center;font-size:.88rem;opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none}
#toast.show{opacity:1;transform:none}
.login{max-width:380px;margin:12vh auto 0}
.chart text{font-family:inherit;fill:var(--muted);font-size:9px}
@media print{.top,.nav,.fab,.btns,.no-print{display:none!important}body{background:#fff;color:#000;padding:0}.card{box-shadow:none}.scroll{max-height:none;overflow:visible}}

</style>

<body>
<div id="app"><div class="boot">در حال بارگذاری…</div></div>
<div id="sheet-root"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script type="module">
const __jalali=(()=>{// تبدیل تاریخ میلادی/شمسی (الگوریتم jalaali) و ابزارهای نمایش
const MONTHS=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
const div=(a,b)=>~~(a/b), mod=(a,b)=>a-~~(a/b)*b;
const breaks=[-61,9,38,199,426,686,756,818,1111,1181,1210,1635,2060,2097,2192,2262,2324,2394,2456,3178];
function jalCal(jy,noLeap){
  let bl=breaks.length,gy=jy+621,leapJ=-14,jp=breaks[0],jm,jump,leap,leapG,march,n,i;
  for(i=1;i<bl;i++){jm=breaks[i];jump=jm-jp;if(jy<jm)break;leapJ+=div(jump,33)*8+div(mod(jump,33),4);jp=jm;}
  n=jy-jp;leapJ+=div(n,33)*8+div(mod(n,33)+3,4);
  if(mod(jump,33)===4&&jump-n===4)leapJ+=1;
  leapG=div(gy,4)-div((div(gy,100)+1)*3,4)-150;march=20+leapJ-leapG;
  if(noLeap)return{gy,march};
  if(jump-n<6)n=n-jump+div(jump+4,33)*33;
  leap=mod(mod(n+1,33)-1,4);if(leap===-1)leap=4;
  return{leap,gy,march};
}
const g2d=(gy,gm,gd)=>{let d=div((gy+div(gm-8,6)+100100)*1461,4)+div(153*mod(gm+9,12)+2,5)+gd-34840408;return d-div(div(gy+100100+div(gm-8,6),100)*3,4)+752;};
const d2g=jdn=>{let j=4*jdn+139361631;j+=div(div(4*jdn+183187720,146097)*3,4)*4-3908;const i=div(mod(j,1461),4)*5+308;const gd=div(mod(i,153),5)+1,gm=mod(div(i,153),12)+1,gy=div(j,1461)-100100+div(8-gm,6);return{gy,gm,gd};};
const j2d=(jy,jm,jd)=>{const r=jalCal(jy,true);return g2d(r.gy,3,r.march)+(jm-1)*31-div(jm,7)*(jm-7)+jd-1;};
const d2j=jdn=>{const gy=d2g(jdn).gy;let jy=gy-621;const r=jalCal(jy,false),f=g2d(gy,3,r.march);let k=jdn-f,jm,jd;
  if(k>=0){if(k<=185){jm=1+div(k,31);jd=mod(k,31)+1;return{jy,jm,jd};}k-=186;}else{jy-=1;k+=179;if(r.leap===1)k+=1;}
  jm=7+div(k,30);jd=mod(k,30)+1;return{jy,jm,jd};};
const toJalali=(gy,gm,gd)=>d2j(g2d(gy,gm,gd));
const toGregorian=(jy,jm,jd)=>d2g(j2d(jy,jm,jd));
function jalaliToday(){const n=new Date();return toJalali(n.getFullYear(),n.getMonth()+1,n.getDate());}
const isLeap=jy=>jalCal(jy,false).leap===0;
const daysIn=(y,m)=>m<=6?31:m<=11?30:(isLeap(y)?30:29);
const pad=n=>String(n).padStart(2,'0');
const FA='۰۱۲۳۴۵۶۷۸۹';
const fa=s=>String(s).replace(/\d/g,d=>FA[d]);
const en=s=>String(s).replace(/[۰-۹]/g,d=>FA.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));
const fmtDate=s=>s?fa(s):'';
const ymd=(y,m,d)=>`${y}/${pad(m)}/${pad(d)}`;

return {MONTHS,toJalali,toGregorian,jalaliToday,isLeap,daysIn,pad,fa,en,fmtDate,ymd};})();
const {MONTHS,toJalali,toGregorian,jalaliToday,isLeap,daysIn,pad,fa,en,fmtDate,ymd}=__jalali;
const __calc=(()=>{// منطق محاسبات صندوق — همه‌چیز از روی تراکنش‌ها محاسبه می‌شود (بدون ذخیره‌ی جداگانه‌ی مانده)
const TYPES={share:'واریز سهم',repay:'بازپرداخت وام',loan:'پرداخت وام',income:'سایر درآمد',expense:'هزینه'};
const mIdx=(y,m)=>y*12+(m-1);
const fromIdx=i=>({y:Math.floor(i/12),m:i%12+1});
const parts=s=>String(s||'').split('/').map(Number);
const joinIdx=j=>{const p=parts(j);return p[0]&&p[1]?mIdx(p[0],p[1]):-1e9;};
const shareIdx=t=>{const p=parts(t.date);return mIdx(t.forYear||p[0],t.forMonth||p[1]);};

function compute({settings:s,members,tx},cur){
  const curIdx=mIdx(cur.y,cur.m),startIdx=mIdx(s.startYear,s.startMonth);
  const M=new Map(),monthly=new Map();
  const mon=i=>{if(!monthly.has(i))monthly.set(i,{share:0,repay:0,loan:0,income:0,expense:0});return monthly.get(i);};
  for(const m of members){
    const amt=(s.baseShare||0)*(m.coef||1);
    M.set(m.id,{...m,monthly:amt,paid:0,cells:new Map(),loans:[],active:m.status!=='غیرفعال'});
  }
  const F={shares:0,repay:0,loansOut:0,income:0,expense:0};
  const loans=new Map();
  const sorted=[...tx].sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.createdAt||0)-(b.createdAt||0));
  for(const t of sorted){
    const p=parts(t.date),a=+t.amount||0,dIdx=mIdx(p[0],p[1]);
    if(t.type==='share'){
      F.shares+=a;const x=M.get(t.memberId);
      if(x){x.paid+=a;const i=shareIdx(t);x.cells.set(i,(x.cells.get(i)||0)+a);}
      mon(shareIdx(t)).share+=a;
    }else if(t.type==='loan'){
      F.loansOut+=a;mon(dIdx).loan+=a;
      loans.set(t.loanNo,{no:t.loanNo,memberId:t.memberId,date:t.date,idx:dIdx,amount:a,n:t.installments||s.defaultInstallments||1,repaid:0,txId:t.id});
    }else if(t.type==='repay'){F.repay+=a;mon(dIdx).repay+=a;}
    else if(t.type==='income'){F.income+=a;mon(dIdx).income+=a;}
    else if(t.type==='expense'){F.expense+=a;mon(dIdx).expense+=a;}
  }
  for(const t of sorted)if(t.type==='repay'){const l=loans.get(t.loanNo);if(l)l.repaid+=+t.amount||0;}
  let overdueLoanTotal=0;
  for(const l of loans.values()){
    l.instAmt=Math.round(l.amount/l.n);
    l.paidCount=l.instAmt?Math.min(l.n,Math.floor((l.repaid+1)/l.instAmt)):0;
    l.balance=Math.max(0,l.amount-l.repaid);
    l.remaining=l.n-l.paidCount;
    l.dueCount=Math.max(0,Math.min(l.n,curIdx-l.idx));
    l.overdueAmt=Math.max(0,l.dueCount*l.instAmt-l.repaid);
    l.overdueCount=Math.ceil(l.overdueAmt/(l.instAmt||1));
    l.done=l.repaid>=l.amount;
    l.status=l.done?'done':l.overdueCount>0?'overdue':'active';
    l.schedule=Array.from({length:l.n},(_,k)=>{const idx=l.idx+k+1;
      return{k:k+1,idx,state:k<l.paidCount?'paid':idx<curIdx?'overdue':idx===curIdx?'due':'future'};});
    l.nextIdx=l.done?null:l.idx+l.paidCount+1;
    const m=M.get(l.memberId);if(m)m.loans.push(l);
    if(!l.done)overdueLoanTotal+=l.overdueAmt;
  }
  let debtTotal=0,curPaidCount=0,activeCount=0;
  for(const m of M.values()){
    const ms=Math.max(startIdx,joinIdx(m.join));
    m.startIdx=ms;
    m.due=m.active?Math.max(0,curIdx-ms+1):0;
    m.monthsPaid=m.monthly?Math.floor((m.paid+1)/m.monthly):0;
    m.debt=Math.max(0,m.due*m.monthly-m.paid);
    m.prepaid=Math.max(0,m.monthsPaid-m.due);
    m.curAmt=m.cells.get(curIdx)||0;
    m.curPaid=m.curAmt>=m.monthly&&m.monthly>0;
    m.loanBalance=m.loans.reduce((n,l)=>n+(l.done?0:l.balance),0);
    m.overdueAmt=m.loans.reduce((n,l)=>n+(l.done?0:l.overdueAmt),0);
    m.status=m.active?(m.debt>0||m.overdueAmt>0?'debtor':'ok'):'inactive';
    debtTotal+=m.debt;

function rMonthly() {
  const C = S.c, y = S.ry; let T = { share: 0, repay: 0, loan: 0, income: 0, expense: 0 };

function closeSheet() { $('#sheet-root').innerHTML = ''; F = null; }

function dateSelects(p, d) {
  const s = S.data.settings, ys = []; for (let y = s.startYear - 1; y <= S.cur.y + 2; y++) ys.push(y);
  return `<div class="r3"><select class="in" data-f="${p}y">${ys.map(y => `<option ${y === d.y ? 'selected' : ''} value="${y}">${fa(y)}</option>`).join('')}</select>

}
function loanOf(no) { return S.c.loans.find(l => l.no === +no); }
function memberLoans(mid, keep) { return S.c.loans.filter(l => l.memberId === +mid && (!l.done || l.no === keep)); }
function nextLoanNo() { return Math.max(0, ...S.c.loans.map(l => l.no)) + 1; }
function defaults() { // مقادیر پیش‌فرض بر اساس نوع و عضو
  const s = S.data.settings, m = F.memberId ? member(F.memberId) : null;
  if (F.type === 'share' && m && !F.editing) { const n = nextUnpaid(m, S.c.curIdx); F.forY = n.y; F.forM = n.m; }
  if (F.type === 'repay') { const ls = memberLoans(F.memberId, F.loanNo); if (!ls.find(l => l.no === +F.loanNo)) F.loanNo = ls[0] ? ls[0].no : ''; }
  if (F.type === 'loan' && !F.editing) { F.loanNo = nextLoanNo(); }
  if (!F.touched) {
    F.amount = F.type === 'share' ? (m ? m.monthly : s.baseShare) : F.type === 'repay' ? (loanOf(F.loanNo) || {}).instAmt || '' :
      F.type === 'loan' ? s.defaultLoan : '';
  }
}
function txDyn() {
  const need = ['share', 'repay', 'loan'].includes(F.type);
  const mem = `<label class="f"><span>عضو${need ? '' : ' (اختیاری)'}</span><select class="in" data-f="memberId"><option value="">${need ? 'انتخاب عضو…' : '— بدون عضو —'}</option>${S.c.members.filter(m => m.active || m.id === +F.memberId).map(m => `<option value="${m.id}" ${m.id === +F.memberId ? 'selected' : ''}>${fa(m.id)} · ${esc(m.name)}</option>`).join('')}</select></label>`;
  let x = '';
  if (F.type === 'share') x = `<label class="f"><span>بابت ماه</span></label><div class="r2" style="margin-top:-8px;margin-bottom:12px"><select class="in" data-f="forM">${MONTHS.map((n, i) => `<option value="${i + 1}" ${+F.forM === i + 1 ? 'selected' : ''}>${n}</option>`).join('')}</select><select class="in" data-f="forY">${[F.forY - 1, F.forY, F.forY + 1].map(y => `<option ${+F.forY === y ? 'selected' : ''} value="${y}">${fa(y)}</option>`).join('')}</select></div>`;
  if (F.type === 'repay') { const ls = memberLoans(F.memberId, F.loanNo);
    x = ls.length ? `<label class="f"><span>وام</span><select class="in" data-f="loanNo">${ls.map(l => `<option value="${l.no}" ${l.no === +F.loanNo ? 'selected' : ''}>وام ${fa(l.no)} — مانده ${num(l.balance)}</option>`).join('')}</select></label>` : (F.memberId ? '<div class="note warn">این عضو وام فعالی ندارد.</div>' : ''); }
  if (F.type === 'loan') x = `<label class="f"><span>تعداد اقساط</span><input class="in ltr" data-f="installments" value="${F.installments}" inputmode="numeric"></label>`;
  return mem + x;
}
function txInfo() {
  const s = S.data.settings, m = F.memberId ? member(F.memberId) : null, out = [];
  const amt = parseMoney(F.amount);
  if (F.type === 'share' && m) {
    const got = m.cells.get(mIdx(+F.forY, +F.forM)) || 0, own = F.editing ? (F.origAmt || 0) : 0;
    if (got - own >= m.monthly) out.push(['warn', `سهم ${mName(+F.forY, +F.forM)} این عضو قبلاً کامل پرداخت شده.`]);
    if (m.debt > 0) out.push(['', `بدهی فعلی سهم: ${num(m.debt)} ${unit()}`]);
  }
  if (F.type === 'repay') { const l = loanOf(F.loanNo); if (l) out.push(['', `قسط شماره ${fa(F.editing && F.instNo ? F.instNo : l.paidCount + 1)} از ${fa(l.n)} · مبلغ قسط ${num(l.instAmt)} · مانده وام ${num(l.balance)}`]); }
  if (F.type === 'loan') {
    const n = +en(F.installments) || 0;
    if (n > 0 && amt) out.push(['', `وام شماره ${fa(F.loanNo)} · هر قسط ${num(Math.round(amt / n))} ${unit()} · قسط اول: ${(f => mName(f.y, f.m))(fromIdx(mIdx(+F.y, +F.m) + 1))}`]);
    if (m && m.debt > 0) out.push(['warn', `طبق قوانین، وام به عضو بدون بدهی داده می‌شود؛ این عضو ${num(m.debt)} ${unit()} بدهی سهم دارد.`]);
    if (m && m.loans.some(l => !l.done)) out.push(['warn', 'این عضو وام فعال دیگری هم دارد.']);
    if (amt && amt > S.c.fund.balance) out.push(['warn', `مبلغ از موجودی نقدی صندوق (${num(S.c.fund.balance)}) بیشتر است.`]);
  }
  if (F.type === 'expense' && amt > S.c.fund.balance) out.push(['warn', 'مبلغ از موجودی صندوق بیشتر است.']);
  return out.map(([c, t]) => `<div class="note ${c}">${t}</div>`).join('') + `<div class="small muted" id="amt-words" style="margin:-6px 0 10px">${amt ? num(amt) + ' ' + unit() : ''}</div>`;
}
function openTx(o = {}) {
  const t = o.tx, td = jalaliToday(), p = t ? t.date.split('/').map(Number) : [td.jy, td.jm, td.jd];
  F = { editing: !!t, id: t && t.id, type: t ? t.type : (o.type || 'share'), memberId: t ? (t.memberId || '') : (o.member || ''), y: p[0], m: p[1], d: p[2],
    amount: t ? t.amount : '', touched: !!t, method: t ? t.method : 'کارت', note: t ? t.note || '' : '', forY: t ? t.forYear || p[0] : S.cur.y, forM: t ? t.forMonth || p[1] : S.cur.m,
    loanNo: t ? t.loanNo || '' : (o.loan || ''), installments: t ? t.installments || S.data.settings.defaultInstallments : S.data.settings.defaultInstallments, instNo: t && t.instNo, origAmt: t ? t.amount : 0 };
  if (t) { const m = F.memberId && member(F.memberId); if (m && t.type === 'share') { /* حفظ مقدار ماه */ } }
  defaults(); paintTx();
}
function paintTx() {
  openSheet(`<form id="txf"><h3>${F.editing ? 'ویرایش تراکنش' : 'ثبت تراکنش'}</h3>
  <div class="seg">${Object.entries(TM).map(([k, v]) => `<button type="button" class="${F.type === k ? 'on' : ''}" data-act="seg-type" data-v="${k}">${v.l}</button>`).join('')}</div>
  <div id="f-dyn">${txDyn()}</div>
  <label class="f"><span>تاریخ پرداخت</span></label><div style="margin-top:-8px;margin-bottom:12px">${dateSelects('', { y: +F.y, m: +F.m, d: +F.d })}</div>
  <label class="f"><span>مبلغ (${unit()})</span><input class="in ltr money" data-f="amount" value="${group(parseMoney(F.amount))}" inputmode="numeric" placeholder="0" autocomplete="off"></label>
  <div id="f-info">${txInfo()}</div>
  <div class="r2"><label class="f"><span>روش پرداخت</span><select class="in" data-f="method">${METHODS.map(x => `<option ${F.method === x ? 'selected' : ''}>${x}</option>`).join('')}</select></label>
  <label class="f"><span>شرح (اختیاری)</span><input class="in" data-f="note" value="${esc(F.note)}"></label></div>
  <div class="btns"><button class="btn" style="flex:1" type="submit">${F.editing ? 'ذخیره' : 'ثبت'}</button>${F.editing ? '<button class="btn bad" type="button" data-act="tx-del">حذف</button>' : ''}<button class="btn sec" type="button" data-act="close">انصراف</button></div></form>`);
}
function submitTx() {
  const amount = parseMoney(F.amount), need = ['share', 'repay', 'loan'].includes(F.type);
  if (need && !F.memberId) return toast('عضو را انتخاب کنید');
  if (!amount) return toast('مبلغ را وارد کنید');
  const dd = Math.min(+F.d, daysIn(+F.y, +F.m));
  const t = { date: ymd(+F.y, +F.m, dd), type: F.type, amount, method: F.method, note: F.note.trim() };
  if (F.memberId) t.memberId = +F.memberId;
  if (F.type === 'share') { t.forYear = +F.forY; t.forMonth = +F.forM; }
  if (F.type === 'repay') { const l = loanOf(F.loanNo); if (!l) return toast('وام فعالی برای این عضو نیست'); t.loanNo = l.no; t.instNo = F.editing && F.instNo ? F.instNo : l.paidCount + 1; }
  if (F.type === 'loan') { const n = +en(F.installments); if (!(n > 0)) return toast('تعداد اقساط نامعتبر است'); t.loanNo = +F.loanNo; t.installments = n; }
  if (!t.note) delete t.note;
  const wasOnline = navigator.onLine, editing = F.editing;
  editing ? S.store.updateTx(F.id, t) : S.store.addTx(t);
  closeSheet();
  toast(wasOnline ? (editing ? 'ویرایش شد' : 'ثبت شد ✓') : 'ثبت شد؛ پس از اتصال به اینترنت ارسال می‌شود ✓');
}
function openMember(id) {
  const m = id ? S.c.M.get(+id) : { id: Math.max(0, ...S.c.members.map(x => x.id)) + 1, name: '', join: ymd(S.cur.y, S.cur.m, 1), status: 'فعال', coef: 1 };
  openSheet(`<form id="mf" data-id="${m.id}" data-new="${id ? 0 : 1}"><h3>${id ? 'ویرایش عضو' : 'عضو جدید'} (کد ${fa(m.id)})</h3>
  <label class="f"><span>نام و نام خانوادگی</span><input class="in" name="name" value="${esc(m.name)}" required></label>
  <div class="r2"><label class="f"><span>تاریخ عضویت (۱۴۰۵/۰۱/۰۱)</span><input class="in ltr" name="join" value="${esc(m.join)}" inputmode="numeric" pattern="\\d{4}/\\d{2}/\\d{2}"></label>
  <label class="f"><span>ضریب سهم</span><input class="in ltr" name="coef" value="${m.coef}" inputmode="decimal"></label></div>
  <label class="f"><span>وضعیت</span><select class="in" name="status"><option ${m.status === 'فعال' ? 'selected' : ''}>فعال</option><option ${m.status === 'غیرفعال' ? 'selected' : ''}>غیرفعال</option></select></label>
  <div class="btns"><button class="btn" style="flex:1" type="submit">ذخیره</button><button class="btn sec" type="button" data-act="close">انصراف</button></div></form>`);
}
function openCurMonth() {
  const s = S.data.settings, ys = []; for (let y = s.startYear; y <= S.cur.y + 1; y++) ys.push(y);
  openSheet(`<form id="cmf"><h3>ماه جاری صندوق</h3><p class="small muted">بدهی‌ها تا پایان این ماه حساب می‌شود. هر ماه که حساب‌ها را بستید آن را جلو ببرید.</p>
  <div class="r2"><select class="in" name="curMonth">${MONTHS.map((n, i) => `<option value="${i + 1}" ${S.cur.m === i + 1 ? 'selected' : ''}>${n}</option>`).join('')}</select>
  <select class="in" name="curYear">${ys.map(y => `<option value="${y}" ${S.cur.y === y ? 'selected' : ''}>${fa(y)}</option>`).join('')}</select></div>
  <div class="btns" style="margin-top:14px"><button class="btn" style="flex:1" type="submit">ذخیره (دستی)</button><button class="btn sec" type="button" data-act="cur-auto">خودکار (امروز)</button></div></form>`);
}

/* ---------- خروجی‌ها ---------- */
function download(name, text, type) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type })); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000); }
function exportCsv() {
  const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const rows = [['تاریخ', 'کد عضو', 'نام عضو', 'نوع', 'مبلغ', 'بابت ماه', 'بابت سال', 'شماره وام', 'شماره قسط', 'تعداد اقساط', 'روش', 'شرح']];
  [...S.data.tx].sort((a, b) => a.date < b.date ? -1 : 1).forEach(t => rows.push([t.date, t.memberId || '', t.memberId ? mname(t.memberId) : '', TM[t.type].l, t.amount, t.forMonth ? MONTHS[t.forMonth - 1] : '', t.forYear || '', t.loanNo || '', t.instNo || '', t.installments || '', t.method || '', t.note || '']));
  download('گردش-مالی.csv', '﻿' + rows.map(r => r.map(q).join(',')).join('\r\n'), 'text/csv');
}
const stamp = () => { const t = jalaliToday(); return `${t.jy}-${pad(t.jm)}-${pad(t.jd)}`; };

/* ---------- رویدادها ---------- */
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, d = el.dataset;
  if (a !== 'rep-debt') e.preventDefault?.();
  switch (a) {
    case 'back': history.length > 1 ? history.back() : (location.hash = '#/'); break;
    case 'close': closeSheet(); break;
    case 'tx-new': openTx({ type: d.type, member: d.member, loan: d.loan }); break;
    case 'tx-edit': { const t = S.data.tx.find(x => x.id === d.id); if (t) openTx({ tx: t }); break; }
    case 'tx-del': if (confirm('این تراکنش حذف شود؟')) { S.store.deleteTx(F.id); closeSheet(); toast('حذف شد'); } break;
    case 'seg-type': F.type = d.v; F.touched = F.editing && F.touched; defaults(); $('#f-dyn').innerHTML = txDyn(); $('#f-info').innerHTML = txInfo();
      $('[data-f=amount]').value = group(parseMoney(F.amount)); document.querySelectorAll('.seg button').forEach(b => b.classList.toggle('on', b.dataset.v === F.type)); break;
    case 'member-new': openMember(); break;
    case 'member-edit': openMember(d.id); break;
    case 'cur-month': openCurMonth(); break;
    case 'cur-auto': S.store.saveSettings({ curMode: 'auto' }); closeSheet(); toast('ماه جاری خودکار شد'); break;
    case 'mf': S.mf = d.v; render(); break;
    case 'more': S.lf.n += 60; render(); break;
    case 'rep': S.rep = d.v; render(); break;
    case 'rep-debt': S.rep = 'debt'; break;
    case 'toggle-loan': { const n = +d.no; S.open.has(n) ? S.open.delete(n) : S.open.add(n); render(); break; }
    case 'print': window.print(); break;
    case 'copy-debt': {
      const L = debtList(), txt = `فهرست بدهکاران ${S.data.settings.fundName} تا ${mName0(S.cur)}\n` + L.map(m => `• ${m.name}: ${num(m.debt + m.overdueAmt)} ${S.data.settings.currency}`).join('\n');
      try { await navigator.clipboard.writeText(txt); toast('کپی شد'); } catch { prompt('کپی کنید:', txt); } break; }
    case 'export-csv': exportCsv(); break;
    case 'export-json': download(`پشتیبان-صندوق-${stamp()}.json`, JSON.stringify(S.store.exportAll(), null, 1), 'application/json'); toast('پشتیبان دریافت شد'); break;
    case 'reset': if (confirm('همه‌ی داده‌های آزمایشی پاک و داده‌های اولیه‌ی اکسل بازگردانی شود؟')) { await S.store.seedInitial(); toast('بازنشانی شد'); } break;
    case 'seed': el.disabled = true; el.textContent = 'در حال بارگذاری…';
      try { await S.store.seedInitial(); toast('داده‌های اولیه بارگذاری شد ✓'); } catch (er) { toast('خطا: ' + er.message); el.disabled = false; } break;
    case 'logout': await S.store.logout(); toast('خارج شدید'); break;
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.sel) { S[t.dataset.sel] = +t.value; render(); return; }
  if (t.dataset.lf) { S.lf[t.dataset.lf] = t.value; S.lf.n = 60; render(); return; }
  if (t.id === 'restore') { restore(t.files[0]); return; }
  if (F && t.dataset.f) {
    const k = t.dataset.f; F[k] = ['forY', 'forM', 'y', 'm', 'd'].includes(k) ? +t.value : t.value;
    if (['memberId', 'loanNo', 'forY', 'forM'].includes(k) || k === 'y' || k === 'm') {
      if (k === 'memberId') { F.touched = F.editing && F.touched; }
      if (k === 'loanNo' && !F.editing) F.touched = false;
      defaults(); $('#f-dyn').innerHTML = txDyn(); $('[data-f=amount]').value = group(parseMoney(F.amount));
    }
    $('#f-info').innerHTML = txInfo();
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'mq') { S.q = t.value; $('#plist').innerHTML = memberRows(); return; }
  if (t.id === 'lq') { S.lf.q = t.value; S.lf.n = 60; const list = filteredTx(); $('#llist').innerHTML = list.length ? txRows(list.slice(0, S.lf.n)) : '<div class="empty">تراکنشی پیدا نشد</div>'; return; }
  if (t.classList.contains('money')) { const v = parseMoney(t.value); t.value = group(v); }
  if (F && t.dataset.f) { F[t.dataset.f] = t.value; if (t.dataset.f === 'amount') F.touched = true; $('#f-info').innerHTML = txInfo(); }
});
document.addEventListener('submit', async e => {
  e.preventDefault(); const f = e.target;
  if (f.id === 'txf') submitTx();
  else if (f.id === 'mf') {
    const v = Object.fromEntries(new FormData(f)), join = en(v.join || '');
    if (!v.name.trim()) return toast('نام را وارد کنید');
    if (!/^\d{4}\/\d{2}\/\d{2}$/.test(join)) return toast('تاریخ عضویت را به شکل ۱۴۰۵/۰۱/۰۱ بنویسید');
    S.store.saveMember({ id: +f.dataset.id, name: v.name.trim().replace(/\s+/g, ' '), join, status: v.status, coef: +en(v.coef) || 1 });
    closeSheet(); toast('ذخیره شد ✓');
  } else if (f.id === 'cmf') {
    const v = Object.fromEntries(new FormData(f)); S.store.saveSettings({ curMode: 'manual', curYear: +v.curYear, curMonth: +v.curMonth }); closeSheet(); toast('ماه جاری تغییر کرد');
  } else if (f.id === 'setf') {
    const v = Object.fromEntries(new FormData(f));
    S.store.saveSettings({ fundName: v.fundName.trim(), manager: v.manager.trim(), currency: v.currency.trim() || 'تومان', card: en(v.card).trim(), baseShare: parseMoney(v.baseShare), startBalance: parseMoney(v.startBalance),
      defaultLoan: parseMoney(v.defaultLoan), defaultInstallments: +en(v.defaultInstallments) || 25, startYear: +v.startYear, startMonth: +v.startMonth, curMode: v.curMode, curYear: +v.curYear, curMonth: +v.curMonth });
    toast('تنظیمات ذخیره شد ✓');
  } else if (f.id === 'loginf') {
    const v = Object.fromEntries(new FormData(f)), er = $('#lerr'); er.hidden = true;
    try { await S.store.login(v.email.trim(), v.pw); location.hash = '#/'; toast('خوش آمدید'); }
    catch (x) { er.hidden = false; er.textContent = /network/.test(x.code || '') ? 'اتصال اینترنت برقرار نیست.' : 'ایمیل یا گذرواژه اشتباه است.'; }
  }
});
async function restore(file) {
  if (!file) return;
  try {
    const d = JSON.parse(await file.text());
    if (!d.settings || !Array.isArray(d.members) || !Array.isArray(d.tx)) throw new Error('فایل پشتیبان معتبر نیست');
    if (!confirm(`بازیابی ${d.members.length} عضو و ${d.tx.length} تراکنش؟ (موارد هم‌شناسه جایگزین می‌شوند)`)) return;
    await S.store.importAll(d); toast('بازیابی شد ✓');
  } catch (er) { toast('خطا: ' + er.message); }
}

/* ---------- شروع ---------- */
(async function boot() {
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  try { S.store = await createStore(); }
  catch (er) { S.fatal = navigator.onLine ? 'اتصال به Firebase برقرار نشد: ' + er.message : 'برای اولین بار باید به اینترنت وصل باشید تا برنامه روی گوشی ذخیره شود.'; render(); return; }
  S.store.subscribe(d => { S.data = d; recompute(); render(); });
  S.store.onAuth(a => { S.auth = a; S.admin = !!a.admin; render(); });
  S.store.onError?.(er => toast(er.code === 'permission-denied' ? 'اجازه‌ی ثبت ندارید؛ با حساب مدیر وارد شوید.' : 'خطا: ' + (er.message || er.code), 4500));
  addEventListener('hashchange', () => { closeSheet(); render(); });
  addEventListener('online', render); addEventListener('offline', render);
  window.__S = S;
})();

</script>
</body>
</html>
